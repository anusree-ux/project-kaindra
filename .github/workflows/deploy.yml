name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 868843318280.dkr.ecr.ap-south-1.amazonaws.com
  EC2_INSTANCE_ID: i-00441d715cc15e2b6

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        run: |
          docker build \
            --target production \
            -t $ECR_REGISTRY/kaindra-backend:${{ github.sha }} \
            -t $ECR_REGISTRY/kaindra-backend:latest \
            ./backend
          docker push $ECR_REGISTRY/kaindra-backend:${{ github.sha }}
          docker push $ECR_REGISTRY/kaindra-backend:latest

      - name: Build and push frontend image
        run: |
          docker build \
            --target production \
            -t $ECR_REGISTRY/kaindra-frontend:${{ github.sha }} \
            -t $ECR_REGISTRY/kaindra-frontend:latest \
            ./frontend
          docker push $ECR_REGISTRY/kaindra-frontend:${{ github.sha }}
          docker push $ECR_REGISTRY/kaindra-frontend:latest

      - name: Deploy to EC2 via SSM
        id: deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["cd /home/ubuntu/kaindra-deploy && aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin '"${{ env.ECR_REGISTRY }}"' && docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d"]}' \
            --comment "Deploy from GitHub Actions" \
            --query "Command.CommandId" \
            --output text)
          echo "Command ID: $COMMAND_ID"
          sleep 15
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --query "Status" \
            --output text