name: Deploy Dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 868843318280.dkr.ecr.ap-south-1.amazonaws.com
  EC2_INSTANCE_ID: i-03bb9514c0ffffadc
  SECRET_NAME: kaindra-dev/backend-env

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::868843318280:role/kaindra-dev-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        run: |
          docker build \
            --target production \
            -t "$ECR_REGISTRY/kaindra-dev-backend:${{ github.sha }}" \
            ./backend

          docker push \
            "$ECR_REGISTRY/kaindra-dev-backend:${{ github.sha }}"

      - name: Build and push frontend image
        run: |
          docker build \
            --target production \
            --build-arg VITE_GOOGLE_MAPS_API_KEY="${{ vars.GOOGLE_MAPS_API_KEY }}" \
            -t "$ECR_REGISTRY/kaindra-dev-frontend:${{ github.sha }}" \
            ./frontend

          docker push \
            "$ECR_REGISTRY/kaindra-dev-frontend:${{ github.sha }}"

      - name: Deploy to EC2 via SSM
        run: |
          COMMANDS=$(jq -n \
            --arg repo "${{ github.repository }}" \
            --arg sha "${{ github.sha }}" \
            --arg region "$AWS_REGION" \
            --arg secret "$SECRET_NAME" \
            --arg registry "$ECR_REGISTRY" \
            '[
              ("curl -fsSL https://raw.githubusercontent.com/" + $repo + "/" + $sha + "/docker/deploy.sh -o /tmp/deploy.sh"),
              "chmod +x /tmp/deploy.sh",
              ("AWS_REGION=" + $region + " SECRET_NAME=" + $secret + " ECR_REGISTRY=" + $registry + " IMAGE_TAG=" + $sha + " GITHUB_REPOSITORY=" + $repo + " /tmp/deploy.sh")
            ]')

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":$COMMANDS}" \
            --comment "Deploy ${{ github.sha }} to Kaindra dev EC2" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text)

            echo "SSM status: $STATUS"

            case "$STATUS" in
              Success)
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed."
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '[Status,StandardOutputContent,StandardErrorContent]' \
                  --output text
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Deployment timed out."
          exit 1