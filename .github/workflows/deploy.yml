
name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        type: choice
        options:
          - development
          - production
        default: development
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: >
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       (inputs.target == 'development' || inputs.target == 'production')) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'development' }}
      cancel-in-progress: false
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'production' && 'production' || 'development' }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      EC2_ENVIRONMENT_TAG: ${{ vars.EC2_ENVIRONMENT_TAG }}
      SECRET_NAME: ${{ vars.SECRET_NAME }}
      ECR_BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
      ECR_FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
      CADDY_DOMAIN: ${{ vars.CADDY_DOMAIN }}
      DATABASE_ROLLBACK_SAFE: ${{ vars.DATABASE_ROLLBACK_SAFE }}
      DEPLOYMENT_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'development' }}
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      BACKEND_TAG_IMAGE: ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_BACKEND_REPOSITORY }}:${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      FRONTEND_TAG_IMAGE: ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_FRONTEND_REPOSITORY }}:${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          for name in AWS_REGION AWS_ROLE_ARN ECR_REGISTRY EC2_INSTANCE_ID EC2_ENVIRONMENT_TAG SECRET_NAME \
            ECR_BACKEND_REPOSITORY ECR_FRONTEND_REPOSITORY CADDY_DOMAIN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name must be configured as a GitHub Actions repository variable."
              exit 1
            fi
          done
          if [[ "$DATABASE_ROLLBACK_SAFE" != "true" ]]; then
            echo "::error::Set DATABASE_ROLLBACK_SAFE=true only after confirming the release uses backward-compatible database migrations."
            exit 1
          fi
          if [[ "$EC2_ENVIRONMENT_TAG" != "$DEPLOYMENT_ENVIRONMENT" ]]; then
            echo "::error::EC2_ENVIRONMENT_TAG must match the selected deployment environment."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Skip outdated commits
        id: freshness
        shell: bash
        run: |
          latest_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ -z "$latest_sha" ]]; then
            echo "::error::Could not determine the current main commit."
            exit 1
          fi

          if [[ "$latest_sha" != "$DEPLOY_SHA" ]]; then
            echo "Skipping outdated deployment $DEPLOY_SHA; main is now $latest_sha."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Diagnose GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            core.info(`Event: ${context.eventName}`);
            core.info(`Ref: ${context.ref}`);
            core.info(`Repository: ${context.repo.owner}/${context.repo.repo}`);
            core.info(`SHA: ${process.env.DEPLOY_SHA}`);

      - name: Configure AWS credentials
        if: steps.freshness.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify EC2 environment identity
        if: steps.freshness.outputs.deploy == 'true'
        shell: bash
        run: |
          instance_environment="$(aws ec2 describe-tags \
            --region "$AWS_REGION" \
            --filters "Name=resource-id,Values=$EC2_INSTANCE_ID" "Name=key,Values=Environment" \
            --query 'Tags[0].Value' \
            --output text)"

          if [[ -z "$instance_environment" || "$instance_environment" == "None" ]]; then
            echo "::error::The EC2 target has no verifiable Environment tag."
            exit 1
          fi
          if [[ "$instance_environment" != "$EC2_ENVIRONMENT_TAG" ||
            "$instance_environment" != "$DEPLOYMENT_ENVIRONMENT" ]]; then
            echo "::error::The EC2 target Environment tag does not match the selected deployment environment."
            exit 1
          fi

          echo "Verified EC2 environment identity for $DEPLOYMENT_ENVIRONMENT."

      - name: Login to Amazon ECR
        if: steps.freshness.outputs.deploy == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        if: steps.freshness.outputs.deploy == 'true'
        run: |
          if image_digest="$(aws ecr describe-images \
            --region "$AWS_REGION" \
            --repository-name "$ECR_BACKEND_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>&1)"; then
            echo "Backend image tag exists; resolving and using its ECR digest."
          else
            if [[ "$image_digest" != *"(ImageNotFoundException)"* ]]; then
              echo "::error::Backend ECR image lookup failed for a reason other than image-not-found."
              echo "$image_digest"
              exit 1
            fi
            docker build \
              --target production \
              -t "$BACKEND_TAG_IMAGE" \
              ./backend

            docker push "$BACKEND_TAG_IMAGE"
            image_digest="$(aws ecr describe-images \
              --region "$AWS_REGION" \
              --repository-name "$ECR_BACKEND_REPOSITORY" \
              --image-ids "imageTag=$IMAGE_TAG" \
              --query 'imageDetails[0].imageDigest' \
              --output text)"
          fi
          if [[ ! "$image_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Backend ECR lookup did not return a valid image digest."
            exit 1
          fi
          echo "BACKEND_IMAGE=$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY@$image_digest" >> "$GITHUB_ENV"

      - name: Build and push frontend image
        if: steps.freshness.outputs.deploy == 'true'
        run: |
          if image_digest="$(aws ecr describe-images \
            --region "$AWS_REGION" \
            --repository-name "$ECR_FRONTEND_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>&1)"; then
            echo "Frontend image tag exists; resolving and using its ECR digest."
          else
            if [[ "$image_digest" != *"(ImageNotFoundException)"* ]]; then
              echo "::error::Frontend ECR image lookup failed for a reason other than image-not-found."
              echo "$image_digest"
              exit 1
            fi
            docker build \
              --target production \
              --build-arg VITE_GOOGLE_CLIENT_ID="${{ vars.VITE_GOOGLE_CLIENT_ID }}" \
              --build-arg VITE_GOOGLE_MAPS_API_KEY="${{ vars.GOOGLE_MAPS_API_KEY }}" \
              -t "$FRONTEND_TAG_IMAGE" \
              ./frontend

            docker push "$FRONTEND_TAG_IMAGE"
            image_digest="$(aws ecr describe-images \
              --region "$AWS_REGION" \
              --repository-name "$ECR_FRONTEND_REPOSITORY" \
              --image-ids "imageTag=$IMAGE_TAG" \
              --query 'imageDetails[0].imageDigest' \
              --output text)"
          fi
          if [[ ! "$image_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Frontend ECR lookup did not return a valid image digest."
            exit 1
          fi
          echo "FRONTEND_IMAGE=$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY@$image_digest" >> "$GITHUB_ENV"

      - name: Deploy to EC2 via SSM
        if: steps.freshness.outputs.deploy == 'true'
        id: remote_deploy
        timeout-minutes: 65
        run: |
          latest_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ -z "$latest_sha" ]]; then
            echo "::error::Could not verify the current main commit before deployment."
            exit 1
          fi
          if [[ "$latest_sha" != "$DEPLOY_SHA" ]]; then
            echo "Skipping stale deployment $DEPLOY_SHA; main is now $latest_sha."
            echo "status=stale" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COMMANDS=$(jq -n \
            --arg repo "${{ github.repository }}" \
            --arg sha "$DEPLOY_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg github_sha "$DEPLOY_SHA" \
            --arg image_tag "$IMAGE_TAG" \
            --arg region "$AWS_REGION" \
            --arg secret "$SECRET_NAME" \
            --arg registry "$ECR_REGISTRY" \
            --arg backend_repository "$ECR_BACKEND_REPOSITORY" \
            --arg frontend_repository "$ECR_FRONTEND_REPOSITORY" \
            --arg deployment_environment "$DEPLOYMENT_ENVIRONMENT" \
            --arg backend_image "$BACKEND_IMAGE" \
            --arg frontend_image "$FRONTEND_IMAGE" \
            --arg caddy_domain "$CADDY_DOMAIN" \
            --arg database_rollback_safe "$DATABASE_ROLLBACK_SAFE" \
            '[
              ("script=/tmp/kaindra-deploy-" + $run_id + "-" + $run_attempt + ".sh; cleanup() { rm -f -- \"$script\" || echo DEPLOY_SCRIPT_CLEANUP_FAILED; }; trap cleanup EXIT; trap \"exit 1\" HUP INT TERM; curl -fsSL https://raw.githubusercontent.com/" + $repo + "/" + $sha + "/docker/deploy.sh -o \"$script\" && chmod 700 \"$script\" && flock -n -E 75 /var/lock/kaindra-deploy.lock env AWS_REGION=" + ($region | @sh) + " SECRET_NAME=" + ($secret | @sh) + " ECR_REGISTRY=" + ($registry | @sh) + " ECR_BACKEND_REPOSITORY=" + ($backend_repository | @sh) + " ECR_FRONTEND_REPOSITORY=" + ($frontend_repository | @sh) + " BACKEND_IMAGE=" + ($backend_image | @sh) + " FRONTEND_IMAGE=" + ($frontend_image | @sh) + " CADDY_DOMAIN=" + ($caddy_domain | @sh) + " DEPLOYMENT_ENVIRONMENT=" + ($deployment_environment | @sh) + " DATABASE_ROLLBACK_SAFE=" + ($database_rollback_safe | @sh) + " IMAGE_TAG=" + ($image_tag | @sh) + " GITHUB_SHA=" + ($github_sha | @sh) + " GITHUB_REPOSITORY=" + ($repo | @sh) + " /bin/bash \"$script\" || { status=$?; if [[ $status -eq 75 ]]; then echo DEPLOYMENT_LOCK=busy; fi; exit $status; }")
            ]')

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":$COMMANDS,\"executionTimeout\":[\"3600\"]}" \
            --comment "Deploy $IMAGE_TAG to $DEPLOYMENT_ENVIRONMENT EC2" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..360}; do
            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "SSM status: $STATUS"

            case "$STATUS" in
              Success)
                DEPLOYMENT_OUTPUT=$(aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text)
                echo "$DEPLOYMENT_OUTPUT"
                echo "status=success" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed for commit $DEPLOY_SHA (images: $IMAGE_TAG)."
                DEPLOYMENT_OUTPUT=$(aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text 2>/dev/null || true)
                if [[ -n "$DEPLOYMENT_OUTPUT" && "$DEPLOYMENT_OUTPUT" != "None" ]]; then
                  echo "$DEPLOYMENT_OUTPUT"
                fi
                echo "status=failed" >> "$GITHUB_OUTPUT"
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Deployment timed out for commit $DEPLOY_SHA (images: $IMAGE_TAG)."
          DEPLOYMENT_OUTPUT=$(aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text 2>/dev/null || true)
          if [[ -n "$DEPLOYMENT_OUTPUT" && "$DEPLOYMENT_OUTPUT" != "None" ]]; then
            echo "$DEPLOYMENT_OUTPUT"
          else
            echo "ROLLBACK_RESULT=unknown; the SSM command may still be running."
          fi
          echo "status=timeout" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Report skipped deployment
        if: steps.freshness.outputs.deploy == 'false' || steps.remote_deploy.outputs.status == 'stale'
        run: echo "Skipped outdated commit $DEPLOY_SHA for $DEPLOYMENT_ENVIRONMENT."

      - name: Add deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Deployment"
            echo "- Environment: $DEPLOYMENT_ENVIRONMENT"
            echo "- Commit: $DEPLOY_SHA"
            echo "- Image tag: $IMAGE_TAG"
            if [[ "${{ steps.remote_deploy.outputs.status }}" == "success" ]]; then
              echo "- Result: deployment command succeeded; backend, frontend, and proxy health checks passed."
            elif [[ "${{ steps.freshness.outputs.deploy }}" == "false" || "${{ steps.remote_deploy.outputs.status }}" == "stale" ]]; then
              echo "- Result: skipped because a newer commit is on main."
            else
              echo "- Result: failed; see deployment step for concise health and rollback status."
            fi
          } >> "$GITHUB_STEP_SUMMARY"