name: CI

on:
  push:
    branches:
      - main
      - devops
  pull_request:
    branches:
      - main

jobs:
  frontend:
    name: Frontend - Lint, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Build Docker image (dev target)
        run: docker build --target dev -t kaindra-frontend:ci-test .

  backend:
    name: Backend - Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Docker image (dev target)
        run: docker build --target dev -t kaindra-backend:ci-test .

  docker:
    name: Docker - Production Images
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend production image
        run: docker build --target production --tag kaindra-backend:ci ./backend

      - name: Build frontend production image
        run: docker build --target production --tag kaindra-frontend:ci ./frontend
      
      - name: Create temporary production environment file
        run: cp .env.example .env.production

      - name: Validate production Docker Compose
        run: docker compose -f docker/docker-compose.prod.yml config
