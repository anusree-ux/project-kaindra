services:
  mongodb:
    image: mongo:8.0
    container_name: kaindra-mongodb

    env_file:
      - ../.env

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ../backend
      target: dev
    container_name: kaindra-backend

    ports:
      - "5000:5000"

    volumes:
    - ../backend:/app
    - /app/node_modules

    env_file:
      - ../.env
    
    depends_on:
      mongodb:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ../frontend
      target: dev
    container_name: kaindra-frontend
    
    ports:
      - "5173:5173"
    
    volumes:
      - ../frontend:/app
      - /app/node_modules

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  
volumes:
  mongodb_data: